# Build + unit tests on Linux and Windows.
#
# CI has no game data, so there is no generated code (src/recomp/gen/): it builds the xboxrecomp runtime with our
# patches, the LAN net core, ssx3_lanbot, the Vulkan back end and our host sources (as a compile check, see
# CMakeLists.txt), then runs the host unit tests in tests/ with ctest.
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev libepoxy-dev libssl-dev libgl-dev glslc

      - name: Apply runtime patches
        run: for p in patches/xboxrecomp/*.patch; do git -C xboxrecomp apply --verbose "../$p"; done

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # The patches must apply byte for byte: keep LF line endings in the checkout and the submodules.
      - name: Disable CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Apply runtime patches
        run: for p in patches/xboxrecomp/*.patch; do git -C xboxrecomp apply --verbose "../$p"; done

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
